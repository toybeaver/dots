# Hand the power key to the compositor.
#
# logind's default HandlePowerKey is `poweroff`, which shuts the machine down on
# the first press — before Hyprland ever sees the event, so no confirmation is
# possible. Setting it to ignore lets the key reach the compositor, where
# .config/hypr/hyprland.lua binds XF86PowerOff to a press-again-to-confirm
# prompt, matching mainMod+SHIFT+Q.
#
# A drop-in rather than an edit to /etc/systemd/logind.conf, so package updates
# to that file merge cleanly.

[Login]
HandlePowerKey=ignore

# Long press remains a real poweroff, deliberately.
#
# `ignore` above means the power button does nothing at all outside a running
# Hyprland session — at a TTY, or if the compositor is wedged. That would remove
# the only physical way to shut down cleanly, so the long press is kept as a
# hardware-level escape hatch. It is unaffected by anything the compositor does.
HandlePowerKeyLongPress=poweroff
