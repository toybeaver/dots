# Mako — flat notifications for the temp theme.
#
# Opaque, square, hairline outline. The glass theme's version of this file
# leans on the compositor to frost what is behind it; this theme disables blur
# entirely (see desktop/hypr.lua), so a translucent panel here would show raw
# unblurred window content through it and read as a bug rather than a material.
#
# Colours match the shell's palette in consts/Theme.qml: near-black surface,
# white text, grey resting outline. Kept in sync by hand — mako cannot read QML.

font=Noto Sans 12
markup=1
format=<span font_family="Oswald" size="large" weight="600">%s</span>\n%b

# Fully opaque, unlike the glass theme's 0x99. There is no blur behind this.
background-color=#000000FF
text-color=#FFFFFFFF

# The outline IS the shape here. The glass theme can drop its border because a
# dark translucent tint already separates the panel from the desktop; an opaque
# black panel on a dark wallpaper has no such edge and would bleed into it.
border-color=#B4B4B4FF
border-size=1
border-radius=0

progress-color=over #FFFFFF33

padding=14
margin=10
outer-margin=12

width=400
height=170

icon-location=left
max-icon-size=48
icon-border-radius=0

anchor=top-right
layer=top
max-visible=5
history=1

# mako's built-in default is 0, which means never expire. Notifications piled up
# forever before any config existed at all.
default-timeout=5000

[urgency=low]
border-color=#6A6A6AFF
default-timeout=3000

# One of only two places this theme spends a colour — the same exception the
# shell's palette makes, and for the same reason: urgency has no other channel
# once every panel is already black and white.
[urgency=critical]
border-size=2
border-color=#FF4060FF
default-timeout=20000
