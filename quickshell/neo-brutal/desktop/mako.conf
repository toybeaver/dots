# Mako — neo-brutalist notifications.
#
# Opaque, square, thick border. Blur is off compositor-wide for this theme
# (desktop/hypr.lua), so translucency would show raw unblurred windows.
#
# mako cannot draw the offset shadow the shell uses, so the border does all the
# work here and is set heavier than the shell's to compensate.

font=Noto Sans 12
markup=1
format=<span font_family="Adwaita Sans" size="large" weight="800">%s</span>\n%b

background-color=#FFFFFFFF
text-color=#000000FF

border-color=#000000FF
border-size=4
border-radius=0

progress-color=over #FF6BA855

padding=14
margin=12
outer-margin=14

width=400
height=170

icon-location=left
max-icon-size=48
icon-border-radius=0

anchor=top-right
layer=top
max-visible=5
history=1

# The center reads this buffer, so it has to be deep enough to be worth
# opening. mako's default is 5, which is a "what did I just miss" buffer rather
# than a notification history. This is the only place the depth can be set —
# the shell cannot keep its own copy, since it only ever sees what mako still
# holds.
max-history=50

# mako's built-in default is 0, which means never expire.
default-timeout=5000

[urgency=low]
border-color=#57534AFF
default-timeout=3000

[urgency=critical]
background-color=#FF6BA8FF
border-size=6
default-timeout=20000

# ---- do-not-disturb --------------------------------------------------------
#
# Toggled by the bell pill (right click) and by the button in the notification
# center, both through `makoctl mode -t do-not-disturb`.
#
# `invisible` hides the popup WITHOUT dropping the notification: mako still
# tracks it, still expires it into history, and still answers ListNotifications
# for it. Verified against a live daemon, and load-bearing — it is what lets the
# center keep collecting while the screen stays quiet. A rule that discarded
# them instead would make silencing and reviewing mutually exclusive.
[mode=do-not-disturb]
invisible=1
