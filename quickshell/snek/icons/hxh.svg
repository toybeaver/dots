<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 78" fill="#ffffff">
  <!-- Hand-drawn reproduction of the Hunter x Hunter mark: two serifed X forms
       flanking a central diamond, in flat white.

       The original is two-tone (black strokes, red diamond), and a naive
       flattening to one colour turns it into a solid blob. The fix is entirely
       geometric, not a fill trick:

         * The X strokes and the diamond never touch. At mid-height the strokes
           span x 25..35 and 85..95 while the diamond reaches only x 42..78, so
           roughly 7 units of background separate them the whole way down. That
           negative space is what makes the diamond read as its own shape.
         * The serif bars are the only place anything would have merged, because
           the two inner bars would meet at x=60 right where the diamond's apex
           passes. They are split with a gap at 54..66 instead, so the apex shows
           through cleanly at both ends.

       An earlier attempt punched the gap with an opposite-wound subpath, which
       does not work: under the default nonzero rule a -1 region is FILLED, so
       the diamond painted itself solid and holed the strokes it crossed
       instead. Switching to evenodd is not the fix either — the two strokes of
       each X overlap at its centre, and evenodd would hollow that out too.
       Keep the geometry disjoint and no fill rule is needed at all.

       Qt's SVG renderer implements only a subset of the spec, so this uses
       nothing but filled paths — no masks, no clip paths, no strokes, no
       gradients.

       Drawn wide (120x78, about 1.54:1). Below roughly 30px wide the serifs
       stop resolving, so SidebarControl renders it at 32. -->

  <!-- The two X forms. Each stroke is a slanted bar with horizontal ends, which
       is what lets the serif bars sit flush on them. -->
  <path d="M8,6   L18,6  L52,72  L42,72  Z
           M42,6  L52,6  L18,72  L8,72   Z
           M68,6  L78,6  L112,72 L102,72 Z
           M102,6 L112,6 L78,72  L68,72  Z"/>

  <!-- Serif caps. The inner pair stops short of centre to clear the diamond. -->
  <path d="M2,3  L26,3  L26,9  L2,9  Z
           M34,3 L54,3  L54,9  L34,9 Z
           M66,3 L86,3  L86,9  L66,9 Z
           M94,3 L118,3 L118,9 L94,9 Z"/>

  <path d="M2,69  L26,69  L26,75  L2,75  Z
           M34,69 L54,69  L54,75  L34,75 Z
           M66,69 L86,69  L86,75  L66,75 Z
           M94,69 L118,69 L118,75 L94,75 Z"/>

  <path d="M60,3 L78,39 L60,75 L42,39 Z"/>
</svg>
