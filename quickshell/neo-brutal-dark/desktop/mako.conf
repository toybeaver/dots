# Mako — neo-brutalist notifications.
#
# Opaque, square, thick border. Blur is off compositor-wide for this theme
# (desktop/hypr.lua), so translucency would show raw unblurred windows.
#
# mako cannot draw the offset shadow the shell uses, so the border does all the
# work here and is set heavier than the shell's to compensate.
#
# A notification is a QUIET block, not an accent one — the same choice the light
# twin makes.
#
# It is tinted toward the theme's violet rather than being a flat grey, but it
# is deliberately a long way below acc_violet's saturation. A notification is
# unbidden: at full accent strength every message arrives looking like an alert,
# which is the job the critical urgency below already has. One that arrived in a colour every time would turn every
# message into an alert. Urgency is the only thing that gets to recolour it.
#
# The border is a DARKER SHADE OF THE BLOCK, not the theme's ink. Ink is right
# everywhere in the shell, because blocks there sit on a panel and the offset
# shadow carries the structure — but a notification floats on the bare desktop,
# which is near-black, so an ink border is invisible and the block loses its
# edge entirely. This is the same rule the shell derives its shadows by, and it
# is the only place in the theme where the border is not ink.

font=Noto Sans 12
markup=1
format=<span font_family="Adwaita Sans" size="large" weight="800">%s</span>\n%b

background-color=#C3BAD8FF
text-color=#0C0C0CFF

border-color=#6A6280FF
border-size=4
border-radius=0

progress-color=over #2DB5AA66

padding=14
margin=12
outer-margin=14

width=400
height=170

icon-location=left
max-icon-size=48
icon-border-radius=0

anchor=top-right
layer=top
max-visible=5
history=1

# The center reads this buffer, so it has to be deep enough to be worth
# opening. mako's default is 5, which is a "what did I just miss" buffer rather
# than a notification history. This is the only place the depth can be set —
# the shell cannot keep its own copy, since it only ever sees what mako still
# holds.
max-history=50

# mako's built-in default is 0, which means never expire.
default-timeout=5000

[urgency=low]
background-color=#A49BB8FF
border-color=#57506BFF
default-timeout=3000

[urgency=critical]
background-color=#FF5C5CFF
border-color=#7A2B2BFF
border-size=6
default-timeout=20000

# ---- do-not-disturb --------------------------------------------------------
#
# Toggled by the bell pill (right click) and by the button in the notification
# center, both through `makoctl mode -t do-not-disturb`.
#
# `invisible` hides the popup WITHOUT dropping the notification: mako still
# tracks it, still expires it into history, and still answers ListNotifications
# for it. Verified against a live daemon, and load-bearing — it is what lets the
# center keep collecting while the screen stays quiet. A rule that discarded
# them instead would make silencing and reviewing mutually exclusive.
[mode=do-not-disturb]
invisible=1
