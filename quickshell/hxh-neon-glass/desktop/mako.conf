# Mako — glass notifications for the hxh-neon-glass theme.
#
# This is real frosted glass, unlike the sidebar. The sidebar reserves an
# exclusive zone and sits over a near-flat wallpaper, so there is nothing
# behind it to blur; notifications float over actual window content, so
# Hyprland's blur has plenty of detail to work with.
#
# The compositor does the frosting, via the mako-glass layer rule in
# hyprland.lua matched on the "notifications" namespace. This file supplies
# what the blur shows through: translucency, the rounded shape, and the
# hairline rim.

font=Noto Sans 12
markup=1
format=<span font_family="Oswald" size="large" weight="600">%s</span>\n%b

# Dark glass. Earlier revisions used a light frost (sage, then cool neutral),
# which suited the old green wallpaper; against the near-black gon / alucard
# wallpapers a pale panel reads as a bright slab stuck on the screen.
#
# Going dark also inverts the old readability problem. A light frost fought the
# text and needed blur brightness pulled down to 0.60 to stay legible over
# bright content; a dark tint under near-white text does that job itself, so
# blur brightness is back up and the blur shows real colour again.
#
# Two things had to be right together, and they are easy to confuse:
#
#   - This alpha. At 0.68 the box looked solid: only 32% of the backdrop came
#     through, and 32% of dark window content is still dark.
#   - Hyprland's blur *strength*, in hyprland.lua. That one is counterintuitive
#     — too much blur is what makes a panel look milky. At size 6 / passes 3 the
#     backdrop was homogenised into flat colour, so nothing behind stayed
#     recognisable. Glass needs shapes softened, not erased. See the note there
#     before raising it.
#
# Readability over bright content is handled in hyprland.lua, not here:
# decoration.blur.brightness darkens what the blur samples. That is the knob to
# reach for, because blur softens detail without darkening it — a blurred white
# page is still white, so raising blur size does nothing for legibility, and
# raising this alpha buys it only by spending the transparency. With brightness
# at 0.60 this can stay low.
background-color=#0E111899
text-color=#EDF1F7FF
border-color=#FFFFFF40
progress-color=over #FF3D8A66

# No border. A hairline rim reads as a pale outline stuck around the panel
# against these near-black wallpapers; the dark tint alone defines the shape.
# Critical notifications re-enable it below, since the coloured rim is their
# only urgency signal.
border-size=0
border-radius=10

padding=14
margin=10
outer-margin=12

width=400
height=170

icon-location=left
max-icon-size=48
icon-border-radius=6

# Top LEFT, matching the bell pill that collects them. No margin is needed to
# clear the bar: the sidebar reserves an exclusive zone, and the compositor
# already lays a layer surface out beside it rather than under it. Verified on
# screen — the popup's left edge starts where the bar ends.
anchor=top-left
layer=top
max-visible=5
history=1

# The center reads this buffer, so it has to be deep enough to be worth
# opening. mako's default is 5, which is a "what did I just miss" buffer rather
# than a notification history. This is the only place the depth can be set —
# the shell cannot keep its own copy, since it only ever sees what mako still
# holds.
max-history=50

# Notifications previously persisted forever because no config existed at all
# and mako's built-in default is 0 (never expire).
default-timeout=5000

# A sound on arrival. mako runs this in a POSIX shell, so $HOME expands — which
# is what keeps a hardcoded /home/... out of a file that is otherwise portable.
# The path is the active-theme link, repointed by bin/shell-theme, so a theme
# can ship its own desktop/notification.wav and otherwise everything shares the
# one at the root of the repo.
#
# Suppressed per mode below rather than by editing this line: `silent` is the
# speaker toggle in the notification center, `do-not-disturb` is the bell's
# right click. `reviewing` deliberately does NOT suppress it — the panel being
# open is a reason not to draw over it, not a reason to stop telling you
# something arrived.
on-notify=exec pw-play "$HOME/.local/state/dots/active/notification.wav"


[urgency=low]
background-color=#0E11188C
default-timeout=3000

[urgency=critical]
border-size=2
border-color=#FF4060CC
default-timeout=20000

# ---- do-not-disturb --------------------------------------------------------
#
# Toggled by the bell pill (right click) and by the button in the notification
# center, both through `makoctl mode -t do-not-disturb`.
#
# `invisible` hides the popup WITHOUT dropping the notification: mako still
# tracks it, still expires it into history, and still answers ListNotifications
# for it. Verified against a live daemon, and load-bearing — it is what lets the
# center keep collecting while the screen stays quiet. A rule that discarded
# them instead would make silencing and reviewing mutually exclusive.
[mode=do-not-disturb]
invisible=1
on-notify=none

# ---- while the notification center is open ---------------------------------
#
# Added by the shell when the center opens and removed when it closes, so
# messages do not pop up over the panel that is already listing them. A mode of
# its own rather than reusing do-not-disturb, which is the user's own switch and
# must not be clobbered by opening a panel.
#
# `invisible` applies RETROACTIVELY — a toast already on screen when the center
# opens disappears too, which is the point. Measured: 25998 notification pixels
# before adding the mode, 0 after.
#
# `default-timeout=0` is what makes the center useful rather than just quiet.
# An action can only be invoked while mako still holds the notification — once
# it expires, mako emits NotificationClosed and both ends have torn it down —
# so holding arrivals open for as long as the panel is means their buttons
# still work. Verified end to end: a client received its action after 8s.
#
# The shell MUST dismiss what is live before removing this mode. Everything
# held here has no timeout, so lifting the mode alone would burst the whole
# batch onto the screen with nothing to make it leave again.
[mode=reviewing]
invisible=1
default-timeout=0

# ---- the sound toggle ------------------------------------------------------
#
# The speaker button in the notification center. Sound only — notifications
# still appear and still land in the list. Held by the shell, which re-applies
# it on startup from ~/.local/state/dots/notifications.json, because a mode is
# runtime state in mako and would otherwise be forgotten every login.
[mode=silent]
on-notify=none
